<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>V6-02 responsive verification frames</title>
  <style>
    body{margin:0;background:#222;color:#fff;font:14px sans-serif}
    section{margin:0 0 24px;padding:12px}
    h2{margin:0 0 8px;font-size:14px}
    iframe{display:block;border:0;background:#090806}
  </style>
</head>
<body>
  <section><h2>1440 × 900</h2><iframe data-viewport="1440" src="../../../index.html" width="1440" height="900" title="1440 pixel preview"></iframe></section>
  <section><h2>1024 × 768</h2><iframe data-viewport="1024" src="../../../index.html" width="1024" height="768" title="1024 pixel preview"></iframe></section>
  <section><h2>768 × 1024</h2><iframe data-viewport="768" src="../../../index.html" width="768" height="1024" title="768 pixel preview"></iframe></section>
  <section><h2>390 × 844</h2><iframe data-viewport="390" src="../../../index.html" width="390" height="844" title="390 pixel preview"></iframe></section>
  <section><h2>320 × 800</h2><iframe data-viewport="320" src="../../../index.html" width="320" height="800" title="320 pixel preview"></iframe></section>
</body>
</html>
