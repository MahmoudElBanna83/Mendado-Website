<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V6-07 bilingual responsive review frames</title>
  <style>
    html,body{margin:0;min-width:1440px;min-height:1024px;background:#090806}
    iframe{position:absolute;inset:0;border:0;opacity:.01;pointer-events:none}
  </style>
</head>
<body>
  <iframe src="../../../en/index.html" title="English 1440 by 900" data-language="en" data-viewport="1440" width="1440" height="900"></iframe>
  <iframe src="../../../en/index.html" title="English 1024 by 768" data-language="en" data-viewport="1024" width="1024" height="768"></iframe>
  <iframe src="../../../en/index.html" title="English 768 by 1024" data-language="en" data-viewport="768" width="768" height="1024"></iframe>
  <iframe src="../../../en/index.html" title="English 390 by 844" data-language="en" data-viewport="390" width="390" height="844"></iframe>
  <iframe src="../../../en/index.html" title="English 320 by 700" data-language="en" data-viewport="320" width="320" height="700"></iframe>
  <iframe src="../../../ar/index.html" title="Arabic 1440 by 900" data-language="ar" data-viewport="1440" width="1440" height="900"></iframe>
  <iframe src="../../../ar/index.html" title="Arabic 1024 by 768" data-language="ar" data-viewport="1024" width="1024" height="768"></iframe>
  <iframe src="../../../ar/index.html" title="Arabic 768 by 1024" data-language="ar" data-viewport="768" width="768" height="1024"></iframe>
  <iframe src="../../../ar/index.html" title="Arabic 390 by 844" data-language="ar" data-viewport="390" width="390" height="844"></iframe>
  <iframe src="../../../ar/index.html" title="Arabic 320 by 700" data-language="ar" data-viewport="320" width="320" height="700"></iframe>
  <script>
    const [language, viewport] = location.hash.slice(1).split('-');
    const selected = document.querySelector(`iframe[data-language="${language}"][data-viewport="${viewport}"]`);
    if (selected) {
      document.querySelectorAll('iframe').forEach(frame => frame.hidden = frame !== selected);
      selected.style.opacity = '1';
      selected.style.pointerEvents = 'auto';

      const targetWidth = Number(viewport);
      const fitViewport = () => {
        const renderedWidth = selected.contentWindow.innerWidth;
        const frameWidth = selected.getBoundingClientRect().width;
        const correctedWidth = frameWidth + targetWidth - renderedWidth;

        selected.style.width = `${correctedWidth}px`;
        document.documentElement.style.minWidth = `${correctedWidth}px`;
        document.body.style.minWidth = `${correctedWidth}px`;
        document.documentElement.dataset.reviewViewport = selected.contentWindow.innerWidth;
      };

      selected.addEventListener('load', fitViewport, { once: true });
      if (selected.contentDocument.readyState === 'complete') fitViewport();
    }
  </script>
</body>
</html>
